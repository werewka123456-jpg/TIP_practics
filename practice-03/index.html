<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПР3 — Управление задачами</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<script type="module" src="./src/main.js"></script>
    <body>
    <header>
    <h1>Управление задачами</h1>
    <p id="dataset-label"></p>     <!-- ← вот этого может не быть -->
    </header>

    <section id="task-summary">
  <h2>Сводка</h2>
  <p>Всего: <span data-stat="total">0</span></p>
  <p>Выполнено: <span data-stat="completed">0</span></p>
  <p>Осталось: <span data-stat="pending">0</span></p>
  <p>Прогресс: <span data-stat="progress">0.0%</span></p>
  <p>Показано: <span data-stat="visible">0</span></p>
</section>

    <section>
    <h2>Фильтры</h2>
    <div id="task-filters">
        <button data-filter="all">Все</button>
        <button data-filter="pending">В работе</button>
        <button data-filter="completed">Выполненные</button>
    </div>
    </section>

    <section>
    <h2>Задачи</h2>
    <ul id="task-list"></ul>
    <p id="empty-message"></p>
    </section>

    <p id="operation-message"></p>
</body>
</html>
